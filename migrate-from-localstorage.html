<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>迁移 localStorage 到 MySQL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .container {
      background: #f5f5f5;
      padding: 30px;
      border-radius: 10px;
    }
    h1 { color: #333; }
    button {
      background: #4CAF50;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }
    .success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }
    pre {
      background: white;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 迁移 localStorage 数据到 MySQL</h1>
    <p>这个工具会将浏览器 localStorage 中的所有 ITSM 数据迁移到 MySQL 数据库。</p>

    <button id="migrateBtn" onclick="migrateData()">开始迁移</button>

    <div id="result"></div>
  </div>

  <script>
    async function migrateData() {
      const btn = document.getElementById('migrateBtn');
      const resultDiv = document.getElementById('result');

      btn.disabled = true;
      btn.textContent = '迁移中...';
      resultDiv.style.display = 'none';

      try {
        // 收集 localStorage 数据
        const keys = [
          'itsm_users',
          'itsm_currentUser',
          'itsm_tickets',
          'itsm_serviceRequests',
          'itsm_articles',
          'itsm_flows',
          'itsm_ticketCounter',
          'itsm_requestCounter',
          'itsm_articleCounter',
          'itsm_flowCounter',
          'chat_history',
          'code_snippets'
        ];

        const data = {};
        let hasData = false;

        keys.forEach(key => {
          const val = localStorage.getItem(key);
          if (val) {
            data[key] = val;
            hasData = true;
          }
        });

        if (!hasData) {
          showResult('⚠️ 没有找到 localStorage 数据', 'error');
          btn.disabled = false;
          btn.textContent = '开始迁移';
          return;
        }

        // 显示要迁移的数据
        console.log('准备迁移的数据:', data);

        // 调用迁移 API
        const response = await fetch('/api/migrate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          showResult(
            `✅ 迁移成功！\n\n迁移统计：\n${JSON.stringify(result.stats, null, 2)}`,
            'success'
          );
        } else {
          showResult(`❌ 迁移失败：${result.error}`, 'error');
        }

      } catch (error) {
        showResult(`❌ 迁移失败：${error.message}`, 'error');
        console.error('迁移错误:', error);
      } finally {
        btn.disabled = false;
        btn.textContent = '开始迁移';
      }
    }

    function showResult(message, type) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = type;
      resultDiv.innerHTML = `<pre>${message}</pre>`;
      resultDiv.style.display = 'block';
    }

    // 页面加载时检查 localStorage
    window.addEventListener('load', () => {
      const keys = ['itsm_users', 'itsm_tickets', 'itsm_articles'];
      let count = 0;
      keys.forEach(key => {
        if (localStorage.getItem(key)) count++;
      });

      if (count > 0) {
        showResult(`ℹ️ 发现 localStorage 数据，点击上方按钮开始迁移`, 'info');
      } else {
        showResult(`⚠️ 未找到 localStorage 数据\n请确保：\n1. 在正确的域名下打开此页面\n2. 之前有使用过 ITSM 系统`, 'error');
      }
    });
  </script>
</body>
</html>
